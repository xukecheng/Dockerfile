name: Build comfyui-mcp Image

on:
  push:
    paths:
      - "comfyui-mcp/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: comfyui-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./comfyui-mcp
          file: ./comfyui-mcp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
