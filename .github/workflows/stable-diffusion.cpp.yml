name: Build stable-diffusion.cpp Image

on:
  push:
    paths:
      - "stable-diffusion.cpp/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: stable-diffusion.cpp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CUDA devel 基础镜像 + 编译产物超过 runner 默认剩余空间，先腾出预装软件
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./stable-diffusion.cpp
          file: ./stable-diffusion.cpp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/stable-diffusion.cpp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
